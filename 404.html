<style>

<script>(function(){var h=location.hostname,p=location.pathname.split('/').filter(Boolean),b=(/\.github\.io$/.test(h)&&p.length)?'/'+p[0]+'/':'/';var a=document.getElementById('home');a.href=b;var s=document.getElementById('sec'),n=5;var t=setInterval(function(){n--;s.textContent=n;if(n<=0){clearInterval(t);location.replace(b);}},1000);})();</script>
